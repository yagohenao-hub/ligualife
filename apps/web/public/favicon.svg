<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="llGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.2" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#4C1D95" flood-opacity="0.45" />
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#llGradient)" stroke="url(#borderGrad)" stroke-width="2" filter="url(#softGlow)" />
  <!-- Crisp LL Monogram -->
  <text 
    x="32" 
    y="42" 
    text-anchor="middle" 
    fill="#FFFFFF" 
    font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Inter', 'Segoe UI', system-ui, sans-serif" 
    font-size="30" 
    font-weight="900" 
    letter-spacing="-1.5"
    style="user-select: none;"
  >LL</text>
</svg>
