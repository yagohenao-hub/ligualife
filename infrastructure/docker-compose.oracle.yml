version: '3.8'

services:
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - DOCKER_ENV=true
      - LOG_LEVEL=ERROR
      # Autenticación global
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-TuSuperSecretaGlobalApiKeyDeEvolution}
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      
      # Base de Datos (PostgreSQL Ligero)
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://admin:admin123@postgres:5432/evolution?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_api
      
      # Usamos Memoria Local en lugar de Redis para Caché
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
      
      # RabbitMQ Desactivado para ahorrar RAM
      - RABBITMQ_ENABLED=false
      
      # Webhook global a Next.js (El cerebro agéntico)
      - WEBHOOK_GLOBAL_URL=https://lingualife.vercel.app/api/pocket-coach/incoming-message
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_EVENTS=APPLICATION_STARTUP,MESSAGES_UPSERT
      - WEBHOOK_EVENTS_ERRORS=true
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    networks:
      - evolution_network
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    container_name: evolution_postgres
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
      - POSTGRES_DB=evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - evolution_network

volumes:
  evolution_instances:
  evolution_store:
  postgres_data:

networks:
  evolution_network:
    driver: bridge
